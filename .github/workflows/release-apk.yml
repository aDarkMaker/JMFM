name: Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'img/**'
      - '.github/README.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        run: |
          VERSION="$(bun -e "import {readVersion} from './scripts/read-version.ts'; console.log(readVersion().version)")"
          CODE="$(bun -e "import {readVersion} from './scripts/read-version.ts'; console.log(readVersion().versionCode)")"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          CI_VERSION_CODE: ${{ steps.version.outputs.code }}
          CI_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: bun run apk:release

      - name: Prepare assets
        run: |
          mkdir -p dist-apk
          cp -f dist-apk/jmfmobile-release.apk dist-apk/JMFM.apk
          cp -f version.json dist-apk/version.json
          ls -lh dist-apk/JMFM.apk dist-apk/version.json

      - name: Publish Latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          TAG=latest
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NOTES="## JMFM 最新安装包

          - Commit: \`${SHORT_SHA}\`
          - Version: \`${VERSION_NAME}\` (versionCode ${VERSION_CODE})
          - Branch: \`${GITHUB_REF_NAME}\`

          下载 **JMFM.apk** 安装；应用内「检查更新」通过 **version.json** 比对版本。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            dist-apk/JMFM.apk \
            dist-apk/version.json \
            --title "Latest" \
            --notes "$NOTES" \
            --latest
